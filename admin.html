<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="s002">Admin Dashboard - Restaurant ATA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="v.css" rel="stylesheet"/>
<link href="assets/favicon.svg" rel="icon"/><link href="assets/css/site.css?v=2" rel="stylesheet"/><script defer="" src="assets/js/config.js"></script><script defer="" src="assets/js/translations.js?v=2"></script><script defer="" src="assets/js/site.js?v=2"></script><script defer="" src="assets/js/admin.js"></script></head>
<body class="bg-light"><noscript>Enable JavaScript to change language, manage privacy preferences and use the interactive forms.</noscript>
<div class="container py-5">
<div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 ata-admin-header">
<div aria-label="Website language" class="ata-language-switch ata-language-switch--light" data-i18n-aria-label="language" role="group"><button aria-label="English" aria-pressed="true" data-set-language="en" lang="en" type="button">EN</button><button aria-label="Македонски" aria-pressed="false" data-set-language="mk" lang="mk" type="button">МК</button></div><div>
<h1 class="fw-bold text-dark">
<i class="fa fa-user-shield text-primary me-2"></i><span data-i18n="s003">Admin Dashboard</span> </h1>
<p class="text-muted mb-0"> <span data-i18n="s004">Manage and review all active table reservations</span> </p>
</div>
<a class="btn btn-outline-dark" href="index.html"><i class="fa fa-arrow-left me-2"></i><span data-i18n="s005">Back to home</span></a>
</div>
<div class="row g-4 mb-5">
<div class="col-md-4">
<div class="card border-0 shadow-sm p-4 text-center">
<h6 class="text-muted text-uppercase small fw-bold"> <span data-i18n="s006">Total reservations</span> </h6>
<h2 class="text-primary fw-bold mb-0" id="stat-total">0</h2>
</div>
</div>
<div class="col-md-4">
<div class="card border-0 shadow-sm p-4 text-center">
<h6 class="text-muted text-uppercase small fw-bold"> <span data-i18n="s007">Reserved seats</span> </h6>
<h2 class="text-warning fw-bold mb-0" id="stat-seats">0 / 50</h2>
</div>
</div>
<div class="col-md-4">
<div class="card border-0 shadow-sm p-4 text-center">
<h6 class="text-muted text-uppercase small fw-bold"> <span data-i18n="s008">Available seats</span> </h6>
<h2 class="text-success fw-bold mb-0" id="stat-available">50</h2>
</div>
</div>
</div>
<div class="card border-0 shadow-sm rounded-3">
<div class="card-body p-4">
<h4 class="fw-bold text-dark mb-4">
<i class="fa fa-list text-primary me-2"></i><span data-i18n="s009">Reservation list</span> <button class="btn btn-outline-dark btn-sm ms-3" data-i18n="refresh" id="ata-admin-refresh" type="button">Refresh</button></h4>
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead class="table-dark">
<tr>
<th scope="col"><span data-i18n="s010">ID</span></th>
<th scope="col"><span data-i18n="s011">Full name</span></th>
<th scope="col"><span data-i18n="s012">Email</span></th>
<th scope="col"><span data-i18n="s013">Date &amp; time</span></th>
<th class="text-center" scope="col"><span data-i18n="s014">Guests</span></th>
<th scope="col"><span data-i18n="s015">Special request</span></th>
<th class="text-center" scope="col"><span data-i18n="s016">Action</span></th>
</tr>
</thead>
<tbody id="reservations-table-body">
<tr>
<td class="text-center py-4 text-muted" colspan="7"> <span data-i18n="s017">Loading reservations…</span> </td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
</div>

</body>
</html>
